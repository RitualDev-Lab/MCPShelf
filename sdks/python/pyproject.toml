[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpshelf"
version = "1.3.0"
description = "Official Python client & MCP Server for MCPShelf (mcp.ritualdev.in) - Discover & audit 400+ Model Context Protocol servers and 570+ DevShelf tools"
readme = "README.md"
authors = [
    { name = "RitualDev Lab", email = "developer@ritualdev.in" }
]
license = { text = "Apache-2.0" }
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-server",
    "claude",
    "cursor",
    "ai-agents",
    "langchain",
    "security-audit"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security"
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0"
]

[project.scripts]
mcpshelf = "mcpshelf.cli:main"
mcpshelf-mcp = "mcpshelf.server:main"

[project.urls]
Homepage = "https://mcp.ritualdev.in"
Repository = "https://github.com/RitualDev-Lab/MCPShelf"
Issues = "https://github.com/RitualDev-Lab/MCPShelf/issues"

[tool.setuptools.packages.find]
where = ["src"]
