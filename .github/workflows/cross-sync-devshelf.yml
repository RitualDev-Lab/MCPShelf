name: Versioned Registry & DevShelf Cross-Sync

on:
  schedule:
    - cron: '30 2 * * *' # Every night at 02:30 UTC
  workflow_dispatch:
  push:
    paths:
      - 'data/catalog.json'
      - 'shelf/**'
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    name: Publish Versioned Registry & Cross-Sync DevShelf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MCPShelf
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Versioned Registry & Cross-Sync Artifacts
        run: npx tsx scripts/sync-to-devshelf.ts

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add site/v1/ site/api/v1/ data/devshelf-mcp-sync.json
          if git diff --staged --quiet; then
            echo "No changes to versioned registry or cross-sync data."
          else
            git commit -m "chore(sync): update versioned registry v1 and devshelf sync artifacts"
            git push origin main
          fi
