name: Publish mcpshelf to PyPI

on:
  push:
    branches: [main]
    paths:
      - "sdks/python/**"
      - ".github/workflows/publish-pypi.yml"
    tags:
      - "python-v*"
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "sdks/python/**"
      - ".github/workflows/publish-pypi.yml"
  workflow_dispatch:

permissions: read-all

jobs:
  build-and-test:
    name: Build & Test mcpshelf Python SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build, twine & test deps
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e sdks/python

      - name: Run Python SDK smoke tests
        run: |
          python -m unittest discover -s sdks/python/tests -v

      - name: Build sdist/wheel and check with twine
        run: |
          cd sdks/python
          python -m build
          python -m twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpshelf-pypi-dist
          path: sdks/python/dist/*

  publish-pypi:
    name: Publish mcpshelf to PyPI
    needs: [build-and-test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/python-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.0
        with:
          name: mcpshelf-pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
