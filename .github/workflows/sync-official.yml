name: Sync Official MCP Registry

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Official Registry
        run: npm run sync

      - name: Build Site & SEO
        run: npm run build:site && npm run build:seo

      - name: Run Integrity Tests
        run: npm test

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ shelf/ site/
          if git diff --staged --quiet; then
            echo "No updates to MCP catalog."
          else
            git commit -m "chore(sync): nightly sync with official modelcontextprotocol/registry"
            git push origin main
          fi
