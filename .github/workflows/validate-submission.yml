name: Community Submission & Schema Gate

on:
  pull_request:
    paths:
      - 'shelf/**'
      - 'data/catalog.json'
      - 'data/submissions.json'
      - 'server.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-submission:
    name: Validate Community Submission & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Version Sync
        run: npm run validate:version

      - name: Run Integrity & Security Audit Tests
        run: npm test

      - name: Audit Submission & Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
            const count = catalog.length;
            const topScore = Math.max(...catalog.map(s => s.trustScore));
            
            const commentBody = `### 🛡️ MCPShelf Automated Submission & Security Audit Bot
            
            ✅ **Manifest Schema**: Validated against \`2025-12-11/server.schema.json\`
            ✅ **Registry Status**: ${count} active verified servers in catalog
            ✅ **Highest Trust Rating**: ${topScore}/10
            
            Your submission has passed the automated schema validation gate and 5-factor security audit!
            View the live rubric at [TRUST_SCORE.md](https://github.com/RitualDev-Lab/MCPShelf/blob/main/TRUST_SCORE.md).`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
