name: Community Submission & Schema Gate

on:
  pull_request:
    paths:
      - 'shelf/**'
      - 'data/catalog.json'
      - 'data/submissions.json'
      - 'server.json'
  workflow_dispatch:

permissions: read-all

jobs:
  validate-submission:
    name: Validate Community Submission & Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Version Sync
        run: npm run validate:version

      - name: Run Integrity & Security Audit Tests
        run: npm test

      - name: Run Automated Schema & Capability Introspector
        run: npx tsx scripts/validate-and-introspect-pr.ts

      - name: Audit Submission & Comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const catalog = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
            const count = catalog.length;
            const topScore = Math.max(...catalog.map(s => s.trustScore));
            
            const commentBody = `### 🛡️ MCPShelf Automated Submission, Introspection & Security Audit Bot
            
            ✅ **Manifest Schema**: Validated against \`2025-12-11/server.schema.json\`
            ✅ **MCP Capability Introspector**: Tools, Prompts & Resources auto-extracted via \`@modelcontextprotocol/sdk\`
            ✅ **Security Risk Flags**: Automated privilege scan complete (Shell, Filesystem, Network & Credentials)
            ✅ **Token Footprint**: Measured context window impact per turn
            ✅ **Registry Status**: ${count} active verified servers in catalog
            ✅ **Highest Trust Rating**: ${topScore}/10
            
            Your submission has passed the automated schema validation gate and 5-factor security audit!
            View the live rubric at [TRUST_SCORE.md](https://github.com/RitualDev-Lab/MCPShelf/blob/main/TRUST_SCORE.md).`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
