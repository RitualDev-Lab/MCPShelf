<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Shelf Platform -->
  <path d="M12 48 L52 48" stroke="#475569" stroke-width="3" stroke-linecap="round" />
  <path d="M16 52 L16 48 M48 52 L48 48" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <circle cx="16" cy="48" r="2.5" fill="#10b981" />
  <circle cx="48" cy="48" r="2.5" fill="#38bdf8" />

  <!-- Lightning Bolt Symbol -->
  <path d="M35 11 L20 31 L31 31 L27 49 L44 25 L33 25 Z" 
        fill="url(#boltGrad)" 
        stroke="#ffffff" 
        stroke-width="1.2"
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
